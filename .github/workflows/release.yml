name: Release

# Builds the downloadable binaries and attaches them to the GitHub Release whenever a
# version tag (v*) is pushed. publish.sh pushes such a tag, so a release is cut
# automatically; it can also be run manually for an existing tag (workflow_dispatch).
#
#   Linux   -> embrace-linux-x86_64.AppImage
#              (portable AppImage: the binary + its full non-system dependency closure
#               and a multi-size icon, assembled by tools/build-appimage.sh via
#               linuxdeploy. Host libs like libGL/libX11 are intentionally NOT bundled,
#               per the AppImage excludelist. Needs libfuse2 at runtime, or run with
#               --appimage-extract-and-run.)
#   Windows -> embrace-windows-x64.exe
#              (static, self-contained, embedded icon; built via tools/win-build.bat)
#
# Both jobs delegate to a committed, locally-runnable build script (build-appimage.sh /
# win-build.bat) — the workflow just calls it. Resources (font / logo / runtime window
# icon) are compiled into the binary (see constants.cr); the AppImage additionally
# carries the desktop-integration icon (resources/embrace-logo.ico → hicolor PNGs).
#
# The asset names are stable and version-less so the website can link
# /releases/latest/download/<asset>; the version stays visible in the About dialog and
# the GitHub Release title.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v2.0.4)"
        required: true
      instrumented:
        description: "Also build embrace-windows-x64-instrumented.exe (diagnostic; slow, writes a log)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # Create the GitHub Release ONCE, before the parallel build jobs attach their
  # assets. Previously BOTH the linux and windows jobs ran softprops/action-gh-release,
  # which each try to CREATE the release for the tag -- a race that intermittently
  # fails the loser with "already_exists". Now creation happens in this single job and
  # the build jobs only upload (idempotent + additive), so there is no race to lose.
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes "" --verify-tag
          fi

  linux:
    needs: create_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.20.0"

      - name: Install build + packaging dependencies
        run: |
          sudo apt-get update
          # SFML 3 build/runtime libs (linking + ldd resolution) plus the AppImage
          # toolchain's helpers (icon extraction, ELF patching, desktop validation).
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libopenal1 libfreetype6 \
            libx11-6 libxrandr2 libxcursor1 libxi6 libudev1 \
            libvorbisfile3 libflac12 \
            imagemagick patchelf desktop-file-utils file

      - name: shards install
        run: shards install

      # Mirrors the Windows job (which just calls win-build.bat): build-appimage.sh
      # sources setup.sh, builds the release binary, bundles the non-system dependency
      # closure + multi-size icon via linuxdeploy, and writes the AppImage under temp/.
      - name: Build AppImage
        run: bash tools/build-appimage.sh

      - name: Upload the AppImage to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" temp/embrace-linux-x86_64.AppImage --repo "$REPO" --clobber

  windows:
    needs: create_release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.20.0"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: shards install
        run: shards install

      # win-build.bat calls setup.bat, compiles the icon resource and links the static
      # SFML/CSFML libs into a self-contained bin\embrace.exe.
      - name: Build release .exe (embedded icon)
        shell: cmd
        run: call tools\win-build.bat

      - name: Name the asset
        shell: bash
        run: |
          set -euo pipefail
          # Stable, version-less name so the website can link
          # /releases/latest/download/embrace-windows-x64.exe (auto-tracks newest 2.0.x).
          cp bin/embrace.exe "embrace-windows-x64.exe"
          echo "ASSET=embrace-windows-x64.exe" >> "$GITHUB_ENV"

      - name: Upload the .exe to the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" "$ASSET" --repo "$REPO" --clobber

  # DIAGNOSTIC build, OPT-IN via the workflow_dispatch input. It is deliberately not part of a
  # normal tag release: it compiles -Dprobe (per-frame log beside the .exe) and -Dcache_validation
  # (every viewport-cache CONTENT layer re-rendered and compared pixel-by-pixel each frame), so it
  # is much slower than the shipping build and must never be handed out as one. The stock
  # `windows` job above is untouched and still produces the published .exe.
  #
  # What the log is for: a column that is in view with no cell widgets, and the auto-size
  # whole-table re-measure, which shows up as a multi-second frame gap. See
  # src/gui/probe.cr for the full list, and for what the instrument CANNOT see — sticky layers are
  # not validated, so a quiet log is not a clean bill of health.
  windows-instrumented:
    needs: create_release
    if: ${{ github.event.inputs.instrumented == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: "1.20.0"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: shards install
        run: shards install

      # Same script, same flags as the release build, plus the two diagnostic flags.
      - name: Build instrumented .exe
        shell: cmd
        env:
          EMBRACE_EXTRA_FLAGS: -Dprobe -Dcache_validation
        run: call tools\win-build.bat

      - name: Name the asset
        shell: bash
        run: |
          set -euo pipefail
          cp bin/embrace.exe "embrace-windows-x64-instrumented.exe"
          echo "ASSET=embrace-windows-x64-instrumented.exe" >> "$GITHUB_ENV"

      - name: Upload the instrumented .exe to the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" "$ASSET" --repo "$REPO" --clobber
